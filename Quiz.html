<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOOTQUIZ PRO - Modo Desafio</title>
    <style>
        :root {
            --bg-main: #0B132B;
            --bg-card: #1C2541;
            --accent: #5BC0BE;
            --text-main: #FFFFFF;
            --correct: #2A9D8F;
            --wrong: #E76F51;
            --gold: #FFD700;
        }
        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: var(--bg-card);
            padding: 25px;
            border-radius: 15px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            text-align: center;
        }
        h1 {
            font-size: 1.5rem;
            color: var(--accent);
            margin-bottom: 5px;
        }
        .subtitle {
            font-size: 0.9rem;
            color: #A0AEC0;
            margin-bottom: 20px;
        }
        /* Tela de Seleção de Nível */
        .nivel-btn {
            background-color: #3A506B;
            color: var(--text-main);
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 8px;
            margin: 8px 0;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .nivel-btn:active {
            transform: scale(0.98);
        }
        .nivel-facil { border-left: 5px solid #2A9D8F; }
        .nivel-medio { border-left: 5px solid #E9C46A; }
        .nivel-dificil { border-left: 5px solid #F4A261; }
        .nivel-impossivel { border-left: 5px solid #E76F51; }

        /* Jogo */
        .question-box {
            font-size: 1.05rem;
            margin: 15px 0;
            line-height: 1.4;
            text-align: left;
            background: #0B132B;
            padding: 15px;
            border-radius: 8px;
        }
        .btn-option {
            background-color: #3A506B;
            color: var(--text-main);
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            margin: 6px 0;
            font-size: 0.95rem;
            cursor: pointer;
            text-align: left;
            transition: background 0.2s;
        }
        .btn-option.correct {
            background-color: var(--correct) !important;
        }
        .btn-option.wrong {
            background-color: var(--wrong) !important;
        }
        .stats-bar {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--accent);
            margin-bottom: 10px;
            font-weight: bold;
        }
        
        /* Tela Final & Animação */
        .hidden { display: none !important; }
        .stars {
            font-size: 2.5rem;
            margin: 15px 0;
            animation: popIn 0.6s ease-in-out;
        }
        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); }
        }
        .score-board {
            font-size: 1.2rem;
            margin: 15px 0;
        }
        .btn-restart {
            background-color: var(--accent);
            color: var(--bg-main);
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 15px;
        }
        .back-link {
            display: inline-block;
            margin-top: 15px;
            color: var(--accent);
            text-decoration: none;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>FOOTQUIZ PRO</h1>
        <p class="subtitle">Modo Desafio Definitivo ⚽</p>

        <!-- 1. SELEÇÃO DE NÍVEL -->
        <div id="screen-menu">
            <p style="margin-bottom: 15px;">Escolha o seu nível de dificuldade:</p>
            <button class="nivel-btn nivel-facil" onclick="iniciarJogo('facil')">🟢 Fácil</button>
            <button class="nivel-btn nivel-medio" onclick="iniciarJogo('medio')">🟡 Médio</button>
            <button class="nivel-btn nivel-dificil" onclick="iniciarJogo('dificil')">🟠 Difícil</button>
            <button class="nivel-btn nivel-impossivel" onclick="iniciarJogo('impossivel')">🔴 Impossível</button>
            <br>
            <a href="index.html" class="back-link">⬅ Voltar ao Menu Principal</a>
        </div>

        <!-- 2. TELA DO JOGO -->
        <div id="screen-game" class="hidden">
            <div class="stats-bar">
                <span id="txt-pergunta-num">Pergunta 1/10</span>
                <span id="txt-pontos">Pontos: 0</span>
            </div>
            <div class="question-box" id="question">Carregando...</div>
            <div id="options-container"></div>
        </div>

        <!-- 3. TELA DE RESULTADO / ANIMAÇÃO -->
        <div id="screen-result" class="hidden">
            <h2>Fim de Jogo!</h2>
            <div class="stars" id="result-stars">⭐⭐⭐</div>
            <div class="score-board" id="result-text">Você fez 100 pontos!</div>
            <button class="btn-restart" onclick="voltarMenu()">Jogar Novamente</button>
            <a href="index.html" class="back-link">⬅ Voltar ao Menu</a>
        </div>
    </div>
